<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d">
  <title id="t">The Vernuli Matrix</title>
  <desc id="d">A process is broken into actions. Each action is asked three questions: what kind of solution it calls for, how much a mistake costs, and how much reviewing costs. Each action lands in one of four outcomes: automate, automate with a person at the right point, redesign, or leave as is. A person at the right point needs a source the AI lacks, time to use it, and authority to stop.</desc>
  <style>
    .bg{fill:#FBF9F5}.card{fill:#F3EFE6;stroke:#E2DCCF}.ink{fill:#1C2421}.mut{fill:#5C6460}.acc{fill:#8C2F2B}.accs{stroke:#8C2F2B}.ln{stroke:#B9B2A3}
    .hi{fill:#8C2F2B}.hit{fill:#FBF9F5}
    text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
    .h{font-size:13px;font-weight:600;letter-spacing:.12em}
    .b{font-size:15px}.s{font-size:12.5px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#141615}.card{fill:#1E2220;stroke:#2E3330}.ink{fill:#EDEAE4}.mut{fill:#9CA6A0}.acc{fill:#E08A5F}.accs{stroke:#E08A5F}.ln{stroke:#4A514D}
      .hi{fill:#E08A5F}.hit{fill:#141615}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mut"/></marker>
  </defs>
  <rect class="bg" width="880" height="470"/>

  <!-- 1. Process -> actions -->
  <text class="h acc" x="40" y="48">1 · BREAK IT DOWN</text>
  <rect class="card" x="40" y="64" width="210" height="150" rx="12"/>
  <text class="b ink" x="58" y="94">A process</text>
  <text class="s mut" x="58" y="122">→ read an email, summarize it</text>
  <text class="s mut" x="58" y="146">→ enter an order, ship it</text>
  <text class="s mut" x="58" y="170">→ approve a payment,</text>
  <text class="s mut" x="72" y="188">issue the invoice</text>

  <line class="ln" x1="252" y1="139" x2="300" y2="139" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 2. Three questions -->
  <text class="h acc" x="304" y="48">2 · ASK EACH ACTION</text>
  <rect class="card" x="304" y="64" width="286" height="44" rx="10"/>
  <text class="b ink" x="320" y="91">What kind of solution does it call for?</text>
  <rect class="card" x="304" y="117" width="286" height="44" rx="10"/>
  <text class="b ink" x="320" y="144">How much does a mistake cost?</text>
  <rect class="card" x="304" y="170" width="286" height="44" rx="10"/>
  <text class="b ink" x="320" y="197">How much does reviewing cost?</text>

  <line class="ln" x1="592" y1="139" x2="636" y2="139" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 3. Outcomes -->
  <text class="h acc" x="640" y="48">3 · LAND IT</text>
  <rect class="card" x="640" y="64" width="212" height="36" rx="10"/>
  <text class="b ink" x="656" y="87">Automate</text>
  <rect class="hi" x="640" y="106" width="212" height="52" rx="10"/>
  <text class="b hit" x="656" y="128" font-weight="600">Automate, with a person</text>
  <text class="b hit" x="656" y="147" font-weight="600">at the right point</text>
  <rect class="card" x="640" y="164" width="212" height="36" rx="10"/>
  <text class="b ink" x="656" y="187">Redesign</text>
  <rect class="card" x="640" y="206" width="212" height="36" rx="10"/>
  <text class="b ink" x="656" y="229">Leave as it is</text>

  <!-- connector to conditions -->
  <path class="ln" d="M746 160 V 300 H 640" fill="none" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 4. Conditions of judgment -->
  <text class="h acc" x="40" y="290">4 · MAKE THE PERSON'S JUDGMENT WORK</text>
  <rect class="card" x="40" y="306" width="190" height="120" rx="12"/>
  <text class="b ink" x="58" y="336" font-weight="600">A source</text>
  <text class="s mut" x="58" y="360">something the AI doesn't</text>
  <text class="s mut" x="58" y="378">have: they were there, they</text>
  <text class="s mut" x="58" y="396">know the client, the data</text>
  <rect class="card" x="246" y="306" width="190" height="120" rx="12"/>
  <text class="b ink" x="264" y="336" font-weight="600">Time</text>
  <text class="s mut" x="264" y="360">verifying must cost less</text>
  <text class="s mut" x="264" y="378">than producing, or people</text>
  <text class="s mut" x="264" y="396">start to skim</text>
  <rect class="card" x="452" y="306" width="190" height="120" rx="12"/>
  <text class="b ink" x="470" y="336" font-weight="600">Authority</text>
  <text class="s mut" x="470" y="360">the power to stop it before</text>
  <text class="s mut" x="470" y="378">the point of no return:</text>
  <text class="s mut" x="470" y="396">send, pay, publish</text>
  <text class="s mut" x="664" y="350">Miss any one and</text>
  <text class="s mut" x="664" y="368">review becomes a formality:</text>
  <text class="s mut" x="664" y="386">it gives peace of mind,</text>
  <text class="s mut" x="664" y="404">but protects nothing.</text>
</svg>
